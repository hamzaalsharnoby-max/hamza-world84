<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza World</title>
<style>
body {
  background: linear-gradient(135deg,#10152f,#35206b);
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
h1 {font-size: 38px;color: #ffd700;}
.card {
  background: #ffffff18;
  padding: 25px;
  margin: 20px auto;
  border-radius: 20px;
  max-width: 400px;
}
button {
  background: #ffd700;
  border: none;
  padding: 14px 25px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>🌍 Hamza World</h1>
<h2>أهلاً بيك في عالمي!</h2>
<p>موقع حمزة الترفيهي 🎮</p>

<div class="card">
<h2>😂 نكتة اليوم</h2>
<p id="joke">اضغط وشوف نكتة!</p>
<button onclick="document.getElementById('joke').innerText='مرة كمبيوتر عطس قاله صاحبه: عندك فيروس 😂'">اضغط هنا</button>
</div>

<div class="card">
<h2>🧠 لغز اليوم</h2>
<p>إيه الشيء اللي له أسنان ومبيعضش؟</p>
<button onclick="alert('المشط! 😁')">اعرف الإجابة</button>
</div>

<h3>❤️ صنع بكل حب بواسطة حمزة</h3>

</body>
</html>
